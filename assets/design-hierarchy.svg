<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" fill="none" role="img" aria-labelledby="title desc">
<title id="title">RISC-V datapath: selected blocks and data flow</title>
<desc id="desc">Source operands pass from the register file through operand selection to the ALU. Writeback selects a result for the register file. The data memory interface shows address and read data paths. Supplied control is shown separately. This is a conceptual diagram, not an extracted schematic or exact wiring diagram.</desc>
<rect width="960" height="352" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#24292f;font-size:15px}.small{font-size:12px;fill:#59636e}.cap{font-size:10px;letter-spacing:1.4px;fill:#59636e}.block{fill:#ffffff;stroke:#6a7683;stroke-width:1.4}.wire{stroke:#6a7683;stroke-width:1.5;stroke-linejoin:round}.ctrl{stroke:#6a7683;stroke-width:1.2;stroke-dasharray:4 4}</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L7 4L1 7" stroke="#6a7683" fill="none" stroke-width="1.3"/></marker></defs>
<rect x="28" y="126" width="900" height="202" rx="5" stroke="#d0d7de"/>
